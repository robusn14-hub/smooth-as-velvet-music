<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth As Velvet — Upload Track</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #e0c97f;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 { font-size: 2rem; margin-bottom: 8px; letter-spacing: 2px; }
    .subtitle { color: #888; margin-bottom: 40px; font-style: italic; }
    .card {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 24px;
    }
    .card h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: #e0c97f; margin-bottom: 20px; opacity: 0.7; }
    label { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 6px; margin-top: 16px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px 14px;
      color: #e0c97f;
      font-size: 0.95rem;
      font-family: 'Georgia', serif;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color: #e0c97f; }
    .drop-zone {
      border: 2px dashed #333;
      border-radius: 10px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #e0c97f; background: #1a1a1a; }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .drop-zone p { color: #888; font-size: 0.9rem; }
    .drop-zone .filename { color: #e0c97f; margin-top: 8px; font-weight: bold; font-size: 0.95rem; }
    input[type="file"] { display: none; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #e0c97f;
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Georgia', serif;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      margin-top: 24px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .status { margin-top: 20px; padding: 14px; border-radius: 8px; font-size: 0.9rem; text-align: center; display: none; line-height: 1.5; }
    .status.info { background: #111; border: 1px solid #333; color: #aaa; display: block; }
    .status.success { background: #081a0e; border: 1px solid #2a5a30; color: #5aba6a; display: block; }
    .status.error { background: #1a0808; border: 1px solid #5a2020; color: #e06060; display: block; }
    .progress { height: 4px; background: #222; border-radius: 2px; margin-top: 16px; overflow: hidden; display: none; }
    .progress-bar { height: 100%; background: #e0c97f; width: 0; transition: width 0.4s; }
    .hint { font-size: 0.75rem; color: #555; margin-top: 8px; }
    a.back { color: #666; text-decoration: none; font-size: 0.85rem; margin-bottom: 28px; display: inline-block; }
    a.back:hover { color: #e0c97f; }
  </style>
</head>
<body>

  <a class="back" href="index.html">← Back to Smooth As Velvet</a>
  <h1>🎵 Upload Track</h1>
  <p class="subtitle">Add a new song to the collection</p>

  <!-- Token -->
  <div class="card">
    <h2>🔑 GitHub Access</h2>
    <label for="token">Personal Access Token</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
    <p class="hint">Saved in your browser only. Never sent anywhere except GitHub.</p>
  </div>

  <!-- Track Info -->
  <div class="card">
    <h2>📝 Track Info</h2>
    <label for="title">Song Title *</label>
    <input type="text" id="title" placeholder="e.g. Blue Saffron" />
    <label for="artist">Artist</label>
    <input type="text" id="artist" placeholder="e.g. Robert" />
    <label for="album">Album / Collection</label>
    <input type="text" id="album" placeholder="e.g. Smooth As Velvet Vol. 1" />
    <label for="genre">Genre</label>
    <input type="text" id="genre" placeholder="e.g. Jazz, R&B, Soul" />
  </div>

  <!-- File Upload -->
  <div class="card">
    <h2>🎧 Audio File</h2>
    <div class="drop-zone" id="dropZone">
      <div class="icon">🎵</div>
      <p>Drag &amp; drop your MP3 here</p>
      <p style="margin-top:4px;font-size:0.8rem;">or click to browse</p>
      <p class="filename" id="fileName"></p>
    </div>
    <input type="file" id="fileInput" accept=".mp3,audio/mpeg" />

    <div class="progress" id="progressWrap">
      <div class="progress-bar" id="progressFill"></div>
    </div>
    <div class="status" id="status"></div>
    <button class="btn" id="uploadBtn" onclick="uploadTrack()" disabled>Upload Track</button>
  </div>

  <script>
    const REPO   = 'robusn14-hub/smooth-as-velvet-music';
    const BRANCH = 'main';
    const API    = 'https://api.github.com';
    let selectedFile = null;

    // Restore saved token
    window.onload = () => {
      const t = localStorage.getItem('sav_gh_token');
      if (t) document.getElementById('token').value = t;
    };

    // Drop zone
    const dropZone  = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

    function setFile(f) {
      selectedFile = f;
      document.getElementById('fileName').textContent = '✅ ' + f.name;
      if (!document.getElementById('title').value) {
        document.getElementById('title').value = f.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ');
      }
      checkReady();
    }

    function checkReady() {
      document.getElementById('uploadBtn').disabled =
        !(selectedFile && document.getElementById('title').value.trim());
    }
    document.getElementById('title').addEventListener('input', checkReady);

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + type;
    }

    function setProgress(pct) {
      document.getElementById('progressWrap').style.display = 'block';
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function slugify(t) {
      return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    async function uploadTrack() {
      const token  = document.getElementById('token').value.trim();
      const title  = document.getElementById('title').value.trim();
      const artist = document.getElementById('artist').value.trim();
      const album  = document.getElementById('album').value.trim();
      const genre  = document.getElementById('genre').value.trim();

      if (!token)        { setStatus('Please enter your GitHub token.', 'error'); return; }
      if (!title)        { setStatus('Please enter a track title.', 'error');     return; }
      if (!selectedFile) { setStatus('Please select an MP3 file.', 'error');     return; }

      localStorage.setItem('sav_gh_token', token);
      document.getElementById('uploadBtn').disabled = true;

      const headers = {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github+json'
      };

      try {
        // 1. Read file as base64
        setStatus('Reading audio file…', 'info');
        setProgress(10);
        const base64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload  = e => res(e.target.result.split(',')[1]);
          r.onerror = rej;
          r.readAsDataURL(selectedFile);
        });

        // 2. Upload MP3 to media/
        setStatus('Uploading audio to GitHub…', 'info');
        setProgress(35);
        const safeFile = selectedFile.name.replace(/\s+/g, '-');
        const filePath = `media/${safeFile}`;

        let existingSha = null;
        try {
          const chk = await fetch(`${API}/repos/${REPO}/contents/${filePath}`, { headers });
          if (chk.ok) existingSha = (await chk.json()).sha;
        } catch(e) {}

        const uploadBody = { message: `Add track: ${title}`, content: base64, branch: BRANCH };
        if (existingSha) uploadBody.sha = existingSha;

        const upRes = await fetch(`${API}/repos/${REPO}/contents/${filePath}`, {
          method: 'PUT', headers, body: JSON.stringify(uploadBody)
        });
        if (!upRes.ok) { const e = await upRes.json(); throw new Error(e.message || 'Upload failed'); }

        // 3. Fetch tracks.json
        setStatus('Updating track catalog…', 'info');
        setProgress(70);

        let catalog = { tracks: [] };
        let catSha  = null;
        const catRes = await fetch(`${API}/repos/${REPO}/contents/tracks.json`, { headers });
        if (catRes.ok) {
          const catJson = await catRes.json();
          catSha = catJson.sha;
          try { catalog = JSON.parse(atob(catJson.content.replace(/\n/g, ''))); } catch(e) {}
          if (!catalog.tracks) catalog.tracks = [];
        }

        // 4. Add entry
        catalog.tracks.push({
          id:     slugify(title) + '-' + Date.now(),
          title,
          artist: artist || 'Unknown Artist',
          album:  album  || '',
          genre:  genre  || '',
          file:   filePath,
          added:  new Date().toISOString().split('T')[0]
        });

        // 5. Push updated tracks.json
        const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(catalog, null, 2))));
        const catBody = { message: `Add to catalog: ${title}`, content: newContent, branch: BRANCH };
        if (catSha) catBody.sha = catSha;

        const catUpRes = await fetch(`${API}/repos/${REPO}/contents/tracks.json`, {
          method: 'PUT', headers, body: JSON.stringify(catBody)
        });
        if (!catUpRes.ok) { const e = await catUpRes.json(); throw new Error(e.message || 'Catalog update failed'); }

        setProgress(100);
        setStatus(`✅ "${title}" added! It will appear on the site in about 1 minute.`, 'success');

        // Reset
        selectedFile = null;
        ['title','artist','album','genre'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('fileName').textContent = '';
        document.getElementById('fileInput').value = '';
        document.getElementById('uploadBtn').disabled = true;

      } catch(err) {
        setStatus('❌ Error: ' + err.message, 'error');
        document.getElementById('uploadBtn').disabled = false;
      }
    }
  </script>

</body>
</html>
